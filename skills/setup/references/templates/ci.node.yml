# CI for a Node project (npm). Written by /loom:setup.
# One job named `check`: the main branch ruleset requires this name.
# It runs the same entry point as the loom hooks: the `check` script of package.json.
# Action versions pinned by /loom:setup; latest releases checked on 2026-11-09.
# pnpm and bun: see the node recipe of /loom:setup for the changed steps.
name: CI

on:
  pull_request:
  push:
    branches: [<main>]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "<node version>"
          cache: npm
      - name: Install
        run: npm ci
      - name: Check
        run: npm run check
