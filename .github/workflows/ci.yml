# loom's own CI (LOOM_SPEC.md 20.1, 21): unit tests and `claude plugin validate --strict`.
# `plugin validate` runs without credentials. The evals cost tokens and run in eval.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.318
      - name: Versions
        run: |
          python3 --version
          git --version
          claude --version
      - name: Check
        run: make check
