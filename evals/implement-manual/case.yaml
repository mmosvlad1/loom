schema_version: "1.1"
name: implement-manual
description: >-
  Quick mode, plan approved; implementation phase 1 lists a Manual verification step.
  /loom:implement commits phase 1, ticks it, logs it as done, and stops for manual
  verification before phase 2 (LOOM_SPEC.md 9.9 step 7, 20.2). Needs Bash git inside the
  eval sandbox. On macOS that needs Homebrew git: without it the /usr/bin/git shim failed
  there, with the Command Line Tools and with full Xcode (LOOM_SPEC.md 24.2).
tags: [implement, quick, git]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  model: haiku
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: /loom:implement
