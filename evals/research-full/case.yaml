schema_version: "1.1"
name: research-full
description: >-
  Full mode, research questions approved. /loom:research writes 02-research.md in review,
  with file:line references to the fixture code, and never reads 00-ticket.md (LOOM_SPEC.md 9.5, 20.2).
  The subagent events hook writes events.jsonl with a start and a stop line of a research agent (11.6).
tags: [research, full]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  model: haiku
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: /loom:research
