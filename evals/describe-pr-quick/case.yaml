schema_version: "1.1"
name: describe-pr-quick
description: >-
  Quick mode, both implementation phases done and committed, no remote and no PR.
  /loom:describe-pr writes pr-body.md in the PR layout of LOOM_SPEC.md 13.6 (Why in one
  sentence, 1-3 Special things to note or None., a Change outline with phase lines and a
  tree or interface diff, the plan attached) before it asks to push; it never pushes or
  runs gh pr create (LOOM_SPEC.md 9.10, 20.2). Needs gh installed (not authenticated):
  without it the skill stops on "gh is not installed" before it writes the body. Commits
  and rebases with Bash git inside the eval sandbox, like implement-manual, so on macOS it
  needs Homebrew git too.
tags: [describe-pr, quick, git]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  model: haiku
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: /loom:describe-pr
