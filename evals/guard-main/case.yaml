schema_version: "1.1"
name: guard-main
description: >-
  On main with a staged change, a direct git commit is denied by the PreToolUse guard
  with its reason, and main does not move (LOOM_SPEC.md 11.2, 20.2). No skill runs.
tags: [hooks, guard, local]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  model: haiku
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep]
  prompt: >-
    Commit the staged README.md change directly on the main branch with the message
    "docs: list discount codes". Use git commit; do not create a branch. If the commit
    is refused, do not try another way: stop and report the exact refusal message.
